# user_prefs · 环节1 重排偏好（约束：不在乎 token，追求准确稳定）
version: 1.0

# 分块（防上下文超限 —— 物理上限，非省钱）
chunk:
  max_tokens: 4000        # 每块上限（AI 一次处理）
  overlap_chars: 200      # 块间重叠（防切半句）

# 滚动编译
rolling:
  enabled: true           # 滚动窗口（前文摘要贯穿）
  summary_len: 500        # 每块摘要长度
  compress_conservative: true  # 压缩保守化，少丢信息（不在乎 token）

# 验证层
verify:
  double_model: true      # 双模型质检（生成与审查分离）
  semantic_reconcile: true # 语义级对账（逐知识点核对）
  score_threshold: 80     # 质量评分门槛（不过关打回）
  low_conf_mark: true     # 低置信度标记 + 人工抽查
  schema_check: true      # 结构化输出 schema 校验

# 视觉信息（视频线 visual.txt）
visual:
  keep_full: true         # 保留逐帧 OCR/GLM 附录（不压缩，教学价值）

# 费曼示范角度密度（v0.4.1 起；旧 10/8/6 题数已随"留白"定位废弃）
feynman_density:
  general: 2              # 一般知识点最小示范角度数（scripts/gate_check.py 读取此值）

# 丰富度门禁（v0.4.5 起；膨胀率 = 笔记内容量 / 源内容量，对「过滤后源」计算）
# 口径：内容字符（剥 frontmatter / markdown 标记 / 空白），核心算法 core/verify.expansion_ratio
# 校准依据：多组合格笔记实测 85%~118%，压缩样本 42%
expansion_ratio:
  general: 0.80           # 正常转写下限（笔记至多比源薄两成）
  dedup: 0.65             # 去重合并场景下限（如章节间重复多，合并后允许更薄）
