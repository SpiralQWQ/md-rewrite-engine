[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md-rewrite-engine"
version = "0.4.3"
description = "Reshape cleaned markdown (transcripts, OCR, PDF extraction) into AI-teachable notes — human-machine relay pipeline with a fail-closed quality gate"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "SpiralQWQ" },
]
keywords = ["markdown", "notes", "llm", "quality-gate", "teaching", "feynman", "rewrite", "study"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/SpiralQWQ/md-rewrite-engine"
Repository = "https://github.com/SpiralQWQ/md-rewrite-engine"
Documentation = "https://github.com/SpiralQWQ/md-rewrite-engine#readme"
Changelog = "https://github.com/SpiralQWQ/md-rewrite-engine/blob/master/CHANGELOG.md"

[project.scripts]
md-rewrite = "md_rewrite_engine.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = { find = { where = ["src"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
